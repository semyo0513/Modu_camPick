<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>오늘의 발표자 · AI 얼굴 인식 학생 추첨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">창순기획 · 스마트 교실</span>
      <h1 class="brand-title">오늘의 발표자</h1>
    </div>

    <nav class="mode-switch" role="tablist">
      <button id="modeCameraBtn" class="mode-btn is-active" role="tab" aria-selected="true">AI 얼굴 인식 모드</button>
      <button id="modeManualBtn" class="mode-btn" role="tab" aria-selected="false">번호 추첨 모드</button>
    </nav>

    <div style="display:flex; gap:8px;">
      <button id="muteToggleBtn" class="icon-btn" title="효과음 음소거 토글">🔊 소리 ON</button>
      <button id="fullscreenBtn" class="icon-btn" title="전체 화면">⛶ 전체화면</button>
    </div>
  </header>

  <main class="stage">

    <!-- ===================== [1] 카메라 모드 ===================== -->
    <section id="cameraMode" class="mode-panel is-active">

      <div class="viewport-container" id="viewportContainer">
        <div class="viewport-screen" id="viewportScreen">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div id="flashOverlay" class="flash-overlay"></div>
        </div>

        <div id="cameraStatus" class="camera-status">
          <span class="dot"></span>
          <span id="cameraStatusText">카메라 및 AI 엔진 준비 중…</span>
        </div>

        <div class="stats-badges">
          <div class="fps-counter"><span id="fpsNum" class="fps-num">0</span> FPS</div>
          <div class="face-counter"><span id="faceCountNum" class="face-counter-num">0</span>명 확정</div>
        </div>

        <div id="touchNotice" class="touch-notice">
          👆 화면 <strong>터치</strong>: 학생 추가/삭제 | <strong>Shift+클릭</strong>: 결석자 제외 토글
        </div>

        <div id="lowCountAlert" class="low-count-alert">
          💡 인식 인원이 적습니다: 카메라를 높이고 정면 배치, 타일 3×2 모드를 시도하세요.
        </div>

        <div id="resultPanel" class="result-panel" hidden>
          <p class="result-eyebrow">오늘의 발표자 당첨</p>
          <div id="resultList" class="result-list"></div>
        </div>
      </div>

      <aside class="control-panel">

        <div class="field">
          <label for="deviceSelect">카메라 장치 선택</label>
          <select id="deviceSelect"></select>
        </div>

        <div class="field-row">
          <button id="mirrorToggleBtn" class="pill-btn is-active" type="button" title="좌우 반전 모드">↔️ 좌우 반전 ON</button>
          <button id="lockPositionsBtn" class="pill-btn" type="button" title="학생들이 움직여도 현재 박스 자리를 유지합니다">📌 위치 고정 (잠금)</button>
        </div>

        <!-- 교실 30명 강제 인식 도구 -->
        <div class="tool-box">
          <div class="tool-box-title">
            <span>교실 30명 좌석 지원 도구</span>
            <span style="font-size:10px; color:var(--ink-dim);">터치로 직접 추가 가능</span>
          </div>
          <div class="tool-btn-grid">
            <button id="fill30Btn" class="action-btn" type="button" title="현재 감지된 학생을 보존하고 빈자리를 채워 30명을 완성합니다">
              ➕ 30명 자동 채우기
            </button>
            <button id="grid30Btn" class="action-btn-sub" type="button" title="교실 5행 6열 책상 배열로 30개 자리를 일괄 배치합니다">
              🏫 30명 좌석 일괄배치
            </button>
          </div>
          <button id="clearAllFacesBtn" class="link-btn" type="button">🗑️ 모든 얼굴 박스 초기화</button>
        </div>

        <div class="field">
          <label for="resolutionSelect">카메라 해상도 모드</label>
          <select id="resolutionSelect">
            <option value="close">근거리 · 720p (소규모 교실, 저사양)</option>
            <option value="standard" selected>표준 · 1080p (일반 교실 권장)</option>
            <option value="far">원거리 고화질 · 1440p (넓은 교실)</option>
            <option value="max">최대 화질 · 4K (초광각 웹캠 전용)</option>
          </select>
        </div>

        <!-- 현장 튜닝 접이식 패널 -->
        <details class="tuning-details" open>
          <summary>⚙️ 정밀 인식 & 추첨 옵션</summary>
          <div class="tuning-content">
            <div class="field">
              <label for="speedSelect">추첨 룰렛 애니메이션 속도</label>
              <select id="speedSelect">
                <option value="fast">⚡ 스피드 (약 1.5초)</option>
                <option value="normal" selected>🎯 표준 룰렛 (약 2.8초)</option>
                <option value="thrill">🔥 극적 긴장감 슬로우 (약 4.2초)</option>
              </select>
            </div>

            <div class="field">
              <label for="confidenceSlider">탐지 민감도 (임계치: <span id="confidenceVal">0.35</span>)</label>
              <input id="confidenceSlider" type="range" min="0.2" max="0.8" step="0.05" value="0.35" />
            </div>

            <div class="field">
              <label for="tileSelect">분할 타일 탐지 (원거리 확대 모드)</label>
              <select id="tileSelect">
                <option value="1x1">1×1 단일 화면 (빠른 속도, 근거리)</option>
                <option value="2x2" selected>2×2 분할 타일 (일반 교실 추천)</option>
                <option value="3x2">3×2 고밀도 타일 (원거리 뒷자리 학생 최적화)</option>
              </select>
            </div>

            <div class="field-row" style="align-items:center;">
              <label style="font-size:12px; color:var(--ink); cursor:pointer;">
                <input id="preprocessBright" type="checkbox" checked /> 탐지 전용 밝기/대비 전처리
              </label>
            </div>
          </div>
        </details>

        <!-- 이전 당첨자 히스토리 -->
        <div class="history-box">
          <div class="history-title">
            <span>🏆 최근 당첨자 기록</span>
          </div>
          <div id="historyTags" class="history-tags">
            <span style="font-size:11px; color:var(--ink-dim);">아직 당첨자가 없습니다.</span>
          </div>
        </div>

        <div class="field">
          <label for="pickCount">몇 명을 뽑을까요?</label>
          <div class="stepper">
            <button id="countMinus" class="stepper-btn">−</button>
            <input id="pickCount" type="number" min="1" value="1" inputmode="numeric" />
            <button id="countPlus" class="stepper-btn">+</button>
          </div>
        </div>

        <button id="drawBtn" class="draw-btn" disabled>추첨 시작</button>
        <button id="resetBtn" class="reset-btn" hidden>다시 추첨하기</button>

      </aside>
    </section>

    <!-- ===================== [2] 번호 추첨 모드 ===================== -->
    <section id="manualMode" class="mode-panel">
      <div class="manual-viewport">
        <div id="manualGrid" class="manual-grid"></div>
        <div id="manualResultPanel" class="result-panel" hidden>
          <p class="result-eyebrow">오늘의 발표자</p>
          <div id="manualResultList" class="result-list"></div>
        </div>
      </div>

      <aside class="control-panel">
        <div class="field">
          <label for="totalCount">전체 학생 수 (출석 번호 1~N)</label>
          <input id="totalCount" type="number" min="1" value="30" inputmode="numeric" />
        </div>

        <div class="field">
          <label for="pickCountManual">몇 명을 뽑을까요?</label>
          <div class="stepper">
            <button id="countMinusM" class="stepper-btn">−</button>
            <input id="pickCountManual" type="number" min="1" value="1" inputmode="numeric" />
            <button id="countPlusM" class="stepper-btn">+</button>
          </div>
        </div>

        <button id="drawBtnManual" class="draw-btn">추첨 시작</button>
        <button id="resetBtnManual" class="reset-btn" hidden>다시 뽑기</button>
      </aside>
    </section>

  </main>

  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <!-- 메인 모듈 실행 -->
  <script type="module" src="app.js"></script>
</body>
</html>
