<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>오늘의 발표자 · AI 얼굴 인식 학생 추첨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   [디자인 시스템 & 토큰]
   - 배경: #0B0E14 / 패널: #12161F, #171C27 / 테두리: #262C3A
   - 포인트: Cyan(#4FD1C5), Gold(#F5B942), Rose(#E1523D), Blue(#38BDF8)
   ============================================================ */
:root {
  --bg: #0B0E14;
  --panel: #12161F;
  --panel-2: #171C27;
  --line: #262C3A;
  --ink: #F1EFE7;
  --ink-dim: #9BA3B4;
  --cyan: #4FD1C5;
  --gold: #F5B942;
  --rose: #E1523D;
  --blue: #38BDF8;
  --radius: 16px;
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
}
button, input, select { font-family: inherit; }

/* ---------- 상단 네비게이션 ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel), var(--bg));
  position: relative;
  z-index: 20;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--gold);
  text-transform: uppercase;
}
.brand-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 24px;
  margin: 0;
  letter-spacing: .02em;
}
.mode-switch {
  margin-left: auto;
  display: flex;
  gap: 8px;
  background: var(--panel-2);
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--ink-dim);
  padding: 8px 18px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s ease;
}
.mode-btn.is-active {
  color: var(--bg);
  background: var(--cyan);
}
.icon-btn {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 9px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color .2s;
}
.icon-btn:hover { border-color: var(--cyan); }

/* ---------- 메인 레이아웃 ---------- */
.stage { padding: 20px 24px; }
.mode-panel { display: none; }
.mode-panel.is-active {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
  align-items: start;
}
@media (max-width: 1024px) {
  .mode-panel.is-active { grid-template-columns: 1fr; }
}

/* ---------- 비디오 뷰포트 (contain으로 왜곡/잘림 없이 정합) ---------- */
.viewport-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* video와 overlay 캔버스는 정확히 일치하는 영역에 겹쳐짐 */
.viewport-screen {
  position: relative;
  width: 100%;
  height: 100%;
}
#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain; /* 비디오 전체가 잘리지 않고 보존 */
  transform: scaleX(-1); /* 기본 미러링 */
  transition: transform .2s ease;
  background: #000;
}
#video.is-unmirrored { transform: scaleX(1); }

#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* 클릭은 뷰포트 컨테이너에서 수신 */
}

/* 화면 상단 오버레이 정보 */
.camera-status {
  position: absolute;
  top: 14px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(11, 14, 20, 0.85);
  backdrop-filter: blur(8px);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--line);
  z-index: 10;
}
.camera-status .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--rose);
  box-shadow: 0 0 8px var(--rose);
}
.camera-status.is-ready .dot {
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

.stats-badges {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  gap: 8px;
  z-index: 10;
}
.face-counter, .fps-counter {
  display: flex;
  align-items: baseline;
  gap: 5px;
  background: rgba(11, 14, 20, 0.85);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-dim);
}
.face-counter-num {
  font-weight: 700;
  font-size: 18px;
  color: var(--gold);
}
.fps-num {
  font-weight: 700;
  font-size: 14px;
  color: var(--cyan);
}

/* 터치 안내 문구 */
.touch-notice {
  position: absolute;
  bottom: 14px;
  left: 14px;
  background: rgba(11, 14, 20, 0.88);
  backdrop-filter: blur(8px);
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(79, 209, 197, 0.4);
  font-size: 12px;
  color: var(--ink);
  pointer-events: none;
  z-index: 10;
}
.touch-notice strong { color: var(--cyan); }

/* 저인식 경고 안내 */
.low-count-alert {
  position: absolute;
  bottom: 14px;
  right: 14px;
  background: rgba(225, 82, 61, 0.2);
  border: 1px solid var(--rose);
  color: #FFA494;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 11px;
  display: none;
  z-index: 10;
}

/* 결과 발표 오버레이 */
.result-panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 24px 16px 20px;
  background: linear-gradient(180deg, rgba(6,8,12,0) 0%, rgba(6,8,12,.88) 35%, rgba(6,8,12,.98) 100%);
  z-index: 15;
}
.result-panel[hidden] { display: none; }
.result-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  font-size: 12px;
  margin: 0;
}
.result-list {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  max-width: 90%;
}
.result-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: pop .4s cubic-bezier(.2,1.4,.4,1) backwards;
}
.result-chip img {
  width: 90px;
  height: 90px;
  border-radius: 16px;
  object-fit: cover;
  border: 3px solid var(--gold);
  box-shadow: 0 0 24px rgba(245, 185, 66, 0.6);
  background: var(--panel-2);
}
.result-chip .result-chip-label {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 14px;
  color: var(--gold);
  background: rgba(11, 14, 20, 0.9);
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid rgba(245, 185, 66, 0.4);
}
@keyframes pop {
  0% { transform: scale(.4) rotate(-6deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* ---------- 우측 컨트롤 패널 ---------- */
.control-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--ink-dim); font-weight: 500; }
.field select, .field input[type="number"] {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 14px;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.pill-btn {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 9px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.pill-btn:hover { border-color: var(--cyan); color: var(--ink); }
.pill-btn.is-active {
  background: rgba(79, 209, 197, 0.15);
  border-color: var(--cyan);
  color: var(--cyan);
}
.pill-btn.is-locked {
  background: rgba(245, 185, 66, 0.2);
  border-color: var(--gold);
  color: var(--gold);
}

/* 교실 30명 지원 도구 상자 */
.tool-box {
  background: var(--panel-2);
  border: 1px solid rgba(79, 209, 197, 0.25);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tool-box-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: .04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tool-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.action-btn {
  background: linear-gradient(135deg, #1f6b63, #154c46);
  border: 1px solid var(--cyan);
  color: #fff;
  padding: 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.action-btn:hover { filter: brightness(1.15); }
.action-btn-sub {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.action-btn-sub:hover { border-color: var(--gold); color: var(--gold); }
.link-btn {
  background: none;
  border: none;
  color: var(--ink-dim);
  font-size: 11px;
  cursor: pointer;
  align-self: flex-end;
}
.link-btn:hover { color: var(--rose); text-decoration: underline; }

/* 현장 튜닝 접이식 패널 */
.tuning-details {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
  overflow: hidden;
}
.tuning-details summary {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--cyan);
  cursor: pointer;
  user-select: none;
}
.tuning-content {
  padding: 12px 14px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input {
  flex: 1;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 18px;
}
.stepper-btn {
  width: 38px; height: 38px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
}
.stepper-btn:active { background: var(--cyan); color: var(--bg); }

/* 추첨 버튼 */
.draw-btn {
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 22px;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 8px 24px rgba(245, 185, 66, 0.3);
}
.draw-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(245, 185, 66, 0.45);
}
.draw-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
  box-shadow: none;
}
.reset-btn {
  background: var(--panel-2);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  border-radius: 12px;
  padding: 14px;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 18px;
  cursor: pointer;
}
.reset-btn:hover { background: rgba(79, 209, 197, 0.15); }

/* ---------- 번호 추첨 모드 레이아웃 ---------- */
.manual-viewport {
  aspect-ratio: 16/9;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.manual-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 900px;
  max-height: 100%;
  overflow-y: auto;
}
.manual-num {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 20px;
  color: var(--ink);
  transition: all .15s ease;
}
.manual-num.is-flash-a {
  background: var(--cyan);
  color: var(--bg);
  transform: scale(1.08);
}
.manual-num.is-flash-b {
  background: var(--gold);
  color: var(--bg);
  transform: scale(1.08);
}
.manual-num.is-winner {
  background: var(--gold);
  color: var(--bg);
  box-shadow: 0 0 20px rgba(245, 185, 66, 0.6);
  transform: scale(1.08);
}

/* 컨페티 캔버스 */
.confetti-canvas {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 998;
}
</style>
</head>
<body>

  <!-- 상단바 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">창순기획 · 스마트 교실</span>
      <h1 class="brand-title">오늘의 발표자</h1>
    </div>

    <nav class="mode-switch" role="tablist">
      <button id="modeCameraBtn" class="mode-btn is-active" role="tab" aria-selected="true">AI 얼굴 인식 모드</button>
      <button id="modeManualBtn" class="mode-btn" role="tab" aria-selected="false">번호 추첨 모드</button>
    </nav>

    <button id="fullscreenBtn" class="icon-btn" title="전체 화면">⛶ 전체화면</button>
  </header>

  <main class="stage">

    <!-- ===================== [1] 카메라 모드 ===================== -->
    <section id="cameraMode" class="mode-panel is-active">

      <div class="viewport-container" id="viewportContainer">
        <div class="viewport-screen" id="viewportScreen">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>

        <div id="cameraStatus" class="camera-status">
          <span class="dot"></span>
          <span id="cameraStatusText">카메라 및 AI 엔진 준비 중…</span>
        </div>

        <div class="stats-badges">
          <div class="fps-counter"><span id="fpsNum" class="fps-num">0</span> FPS</div>
          <div class="face-counter"><span id="faceCountNum" class="face-counter-num">0</span>명 확정</div>
        </div>

        <div id="touchNotice" class="touch-notice">
          👆 화면을 <strong>터치/클릭</strong>하여 학생을 강제 추가하거나 오탐지 박스를 즉시 <strong>삭제</strong>할 수 있습니다.
        </div>

        <div id="lowCountAlert" class="low-count-alert">
          💡 인식 인원이 적습니다: 카메라를 높이고 정면 배치, 타일 3×2 모드를 시도하세요.
        </div>

        <div id="resultPanel" class="result-panel" hidden>
          <p class="result-eyebrow">오늘의 발표자 당첨</p>
          <div id="resultList" class="result-list"></div>
        </div>
      </div>

      <aside class="control-panel">

        <div class="field">
          <label for="deviceSelect">카메라 장치 선택</label>
          <select id="deviceSelect"></select>
        </div>

        <div class="field-row">
          <button id="mirrorToggleBtn" class="pill-btn is-active" type="button" title="좌우 반전 모드">↔️ 좌우 반전 ON</button>
          <button id="lockPositionsBtn" class="pill-btn" type="button" title="학생들이 움직여도 현재 박스 자리를 유지합니다">📌 위치 고정 (잠금)</button>
        </div>

        <!-- 교실 30명 강제 인식 도구 -->
        <div class="tool-box">
          <div class="tool-box-title">
            <span>교실 30명 좌석 지원 도구</span>
            <span style="font-size:10px; color:var(--ink-dim);">터치로 직접 추가 가능</span>
          </div>
          <div class="tool-btn-grid">
            <button id="fill30Btn" class="action-btn" type="button" title="현재 감지된 학생을 보존하고 빈자리를 채워 30명을 완성합니다">
              ➕ 30명 자동 채우기
            </button>
            <button id="grid30Btn" class="action-btn-sub" type="button" title="교실 5행 6열 책상 배열로 30개 자리를 일괄 배치합니다">
              🏫 30명 좌석 일괄배치
            </button>
          </div>
          <button id="clearAllFacesBtn" class="link-btn" type="button">🗑️ 모든 얼굴 박스 초기화</button>
        </div>

        <div class="field">
          <label for="resolutionSelect">카메라 해상도 모드</label>
          <select id="resolutionSelect">
            <option value="close">근거리 · 720p (소규모 교실, 저사양)</option>
            <option value="standard" selected>표준 · 1080p (일반 교실 권장)</option>
            <option value="far">원거리 고화질 · 1440p (넓은 교실)</option>
            <option value="max">최대 화질 · 4K (초광각 웹캠 전용)</option>
          </select>
        </div>

        <!-- 현장 튜닝 접이식 패널 -->
        <details class="tuning-details" open>
          <summary>⚙️ 정밀 인식 튜닝 설정</summary>
          <div class="tuning-content">
            <div class="field">
              <label for="confidenceSlider">탐지 민감도 (임계치: <span id="confidenceVal">0.35</span>)</label>
              <input id="confidenceSlider" type="range" min="0.2" max="0.8" step="0.05" value="0.35" />
            </div>

            <div class="field">
              <label for="tileSelect">분할 타일 탐지 (원거리 확대 모드)</label>
              <select id="tileSelect">
                <option value="1x1">1×1 단일 화면 (빠른 속도, 근거리)</option>
                <option value="2x2" selected>2×2 분할 타일 (일반 교실 추천)</option>
                <option value="3x2">3×2 고밀도 타일 (원거리 뒷자리 학생 최적화)</option>
              </select>
            </div>

            <div class="field-row" style="align-items:center;">
              <label style="font-size:12px; color:var(--ink); cursor:pointer;">
                <input id="preprocessBright" type="checkbox" checked /> 탐지 전용 밝기/대비 전처리
              </label>
            </div>
          </div>
        </details>

        <div class="field">
          <label for="pickCount">몇 명을 뽑을까요?</label>
          <div class="stepper">
            <button id="countMinus" class="stepper-btn">−</button>
            <input id="pickCount" type="number" min="1" value="1" inputmode="numeric" />

      </aside>
    </section>

    <!-- ===================== [2] 번호 추첨 모드 ===================== -->
    <section id="manualMode" class="mode-panel">
      <div class="manual-viewport">
        <div id="manualGrid" class="manual-grid"></div>
        <div id="manualResultPanel" class="result-panel" hidden>
          <p class="result-eyebrow">오늘의 발표자</p>

            <input id="pickCountManual" type="number" min="1" value="1" inputmode="numeric" />
            <button id="countPlusM" class="stepper-btn">+</button>
          </div>

        <button id="drawBtnManual" class="draw-btn">추첨 시작</button>
        <button id="resetBtnManual" class="reset-btn" hidden>다시 뽑기</button>

  </main>

  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <!-- ===================== [3] 자바스크립트 로직 (ES Module) ===================== -->
  <script type="module">
    /* --------------------------------------------------------------------------
       [MediaPipe Tasks Vision 라이브러리 로드]
       - 공식 CDN: jsdelivr / Google Storage
       - 오프라인/로컬 저장소 구축 시:
         MODEL_URL = "./models/blaze_face_short_range.tflite";
         WASM_URL = "./wasm";
       -------------------------------------------------------------------------- */
    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20";

    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
    const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/wasm";

    // 해상도 모드별 프리셋
    const RESOLUTION_PRESETS = {
      close: { width: 1280, height: 720, label: "720p" },
      standard: { width: 1920, height: 1080, label: "1080p" },
      far: { width: 2560, height: 1440, label: "1440p" },
      max: { width: 3840, height: 2160, label: "4K" }
    };

    /* --------------------------------------------------------------------------
       애플리케이션 상태 (State)
       -------------------------------------------------------------------------- */
    const state = {
      mode: "camera",
      faceDetector: null,
      stream: null,
      animationFrameId: null,
      isRunning: false,
      isDrawing: false, // 룰렛 추첨 진행 중 여부

      // 트래킹 상태
      tracks: [], // [{ id, box: {x,y,w,h}, matchedFrames, missedFrames, isManual, keypoints }]
      nextTrackId: 1,

      // 화면 및 좌표계 정합
      videoWidth: 0,
      videoHeight: 0,
      displayWidth: 0,
      displayHeight: 0,
      scaleX: 1,
      scaleY: 1,
      isMirror: true,
      isLocked: false,

      // 현장 튜닝 설정 (localStorage 연동)
      minConfidence: parseFloat(localStorage.getItem("cfg_confidence") || "0.35"),
      tileMode: localStorage.getItem("cfg_tile") || "2x2",
      usePreprocess: localStorage.getItem("cfg_preprocess") !== "false",

      // 타일링 및 성능 최적화
      frameCounter: 0,
      detectCanvas: document.createElement("canvas"), // 탐지 전용 오프스크린 캔버스
      detectCtx: null,

      // FPS 계산
      lastFpsTime: performance.now(),
      fpsFrames: 0
    };
    state.detectCtx = state.detectCanvas.getContext("2d", { willReadFrequently: true });

    /* --------------------------------------------------------------------------
       DOM 참조
       -------------------------------------------------------------------------- */
    const $ = (id) => document.getElementById(id);
    const video = $("video");
    const overlay = $("overlay");
    const overlayCtx = overlay.getContext("2d");
    const viewportContainer = $("viewportContainer");
    const cameraStatus = $("cameraStatus");
    const cameraStatusText = $("cameraStatusText");
    const faceCountNum = $("faceCountNum");
    const fpsNum = $("fpsNum");
    const lowCountAlert = $("lowCountAlert");
    const deviceSelect = $("deviceSelect");
    const resolutionSelect = $("resolutionSelect");
    const mirrorToggleBtn = $("mirrorToggleBtn");
    const lockPositionsBtn = $("lockPositionsBtn");
    const fill30Btn = $("fill30Btn");
    const grid30Btn = $("grid30Btn");
    const clearAllFacesBtn = $("clearAllFacesBtn");
    const confidenceSlider = $("confidenceSlider");
    const confidenceVal = $("confidenceVal");
    const tileSelect = $("tileSelect");
    const preprocessBright = $("preprocessBright");
    const pickCountInput = $("pickCount");
    const drawBtn = $("drawBtn");
    const resetBtn = $("resetBtn");
    const resultPanel = $("resultPanel");
    const resultList = $("resultList");

    // 수동 번호 모드 DOM
    const manualGrid = $("manualGrid");
    const manualResultPanel = $("manualResultPanel");
    const manualResultList = $("manualResultList");
    const totalCountInput = $("totalCount");
    const pickCountManualInput = $("pickCountManual");
    const drawBtnManual = $("drawBtnManual");
    const resetBtnManual = $("resetBtnManual");
    const confettiCanvas = $("confetti");

    /* --------------------------------------------------------------------------
       [1] 좌표계 정합 & 캔버스 리사이징 (허공 박스 원천 방지)
       -------------------------------------------------------------------------- */
    function alignCanvasToVideo() {
      if (!video.videoWidth || !video.videoHeight) return;

      state.videoWidth = video.videoWidth;
      state.videoHeight = video.videoHeight;

      // 비디오가 실제로 렌더링된 표시 영역 크기 산출 (object-fit: contain 기준)
      const containerW = viewportContainer.clientWidth;
      const containerH = viewportContainer.clientHeight;
      const videoRatio = state.videoWidth / state.videoHeight;
      const containerRatio = containerW / containerH;

      let displayW, displayH;
      if (videoRatio > containerRatio) {
        displayW = containerW;
        displayH = containerW / videoRatio;
      } else {
        displayH = containerH;
        displayW = containerH * videoRatio;
      }

      state.displayWidth = displayW;
      state.displayHeight = displayH;

      // 스케일 비율: 비디오 원본 픽셀 -> 화면 표시 픽셀
      state.scaleX = displayW / state.videoWidth;
      state.scaleY = displayH / state.videoHeight;

      // 캔버스 버퍼 해상도와 CSS 렌더링 크기를 비디오 표시 박스와 1:1 완벽 정합
      const dpr = window.devicePixelRatio || 1;
      overlay.width = Math.round(displayW * dpr);
      overlay.height = Math.round(displayH * dpr);
      overlay.style.width = `${displayW}px`;
      overlay.style.height = `${displayH}px`;
      overlay.style.left = `${(containerW - displayW) / 2}px`;
      overlay.style.top = `${(containerH - displayH) / 2}px`;

      overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // 컨페티 캔버스 크기
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    window.addEventListener("resize", alignCanvasToVideo);
    video.addEventListener("loadedmetadata", alignCanvasToVideo);
    new ResizeObserver(alignCanvasToVideo).observe(viewportContainer);

    /* --------------------------------------------------------------------------
       [2] MediaPipe FaceDetector 초기화 (단 1회 생성 및 재사용)
       - runningMode: "IMAGE" (다중 타일 자율 탐지 지원)
       -------------------------------------------------------------------------- */
    async function initFaceDetector() {
      setCameraStatus(false, "AI 모델 로딩 중…");
      try {
        const vision = await FilesetResolver.forVisionTasks(WASM_URL);
        try {
          state.faceDetector = await FaceDetector.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
            runningMode: "IMAGE",
            minDetectionConfidence: state.minConfidence,
            minSuppressionThreshold: 0.3
          });
        } catch (gpuErr) {
          console.warn("GPU Delegate 초기화 실패, CPU로 폴백합니다.", gpuErr);
          state.faceDetector = await FaceDetector.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
            runningMode: "IMAGE",
            minDetectionConfidence: state.minConfidence,
            minSuppressionThreshold: 0.3
          });
        }
        setCameraStatus(true, "AI 모델 로딩 완료");
      } catch (err) {
        console.error("AI FaceDetector 로딩 실패:", err);
        setCameraStatus(false, "AI 모델 로딩 실패. 네트워크 또는 방화벽을 확인해주세요.");
      }
    }

    /* --------------------------------------------------------------------------
       [3] 카메라 스트림 제어
       -------------------------------------------------------------------------- */
    async function startVideoStream(deviceId) {
      if (state.stream) {
        state.stream.getTracks().forEach((t) => t.stop());
      }
      if (state.animationFrameId) {
        cancelAnimationFrame(state.animationFrameId);
        state.animationFrameId = null;
      }

      const preset = RESOLUTION_PRESETS[resolutionSelect.value] || RESOLUTION_PRESETS.standard;
      const constraints = {
        audio: false,
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: preset.width },
          height: { ideal: preset.height },
          frameRate: { ideal: 30 },
          facingMode: deviceId ? undefined : "environment"
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        state.stream = stream;
        video.srcObject = stream;

        // 고급 카메라 제약(연속 초점, 자동 노출 등) 지원 시 요청
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities?.() || {};
        const advanced = {};
        if (caps.focusMode?.includes("continuous")) advanced.focusMode = "continuous";
        if (caps.exposureMode?.includes("continuous")) advanced.exposureMode = "continuous";
        if (caps.whiteBalanceMode?.includes("continuous")) advanced.whiteBalanceMode = "continuous";
        if (Object.keys(advanced).length > 0) {
          track.applyConstraints({ advanced: [advanced] }).catch(() => {});
        }

        await video.play();
        alignCanvasToVideo();

        const actualSettings = track.getSettings();
        setCameraStatus(
          true,
          `준비 완료 · ${actualSettings.width || video.videoWidth}×${actualSettings.height || video.videoHeight} (${preset.label})`
        );

        await populateDeviceList();
        state.isRunning = true;
        state.animationFrameId = requestAnimationFrame(detectionLoop);
      } catch (err) {
        console.error("카메라 열기 실패:", err);
        setCameraStatus(false, "카메라를 시작할 수 없습니다. 권한을 확인해주세요.");
      }
    }

    function setCameraStatus(ready, text) {
      cameraStatus.classList.toggle("is-ready", ready);
      cameraStatusText.textContent = text;
    }

    async function populateDeviceList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter((d) => d.kind === "videoinput");
        deviceSelect.innerHTML = "";
        cams.forEach((cam, i) => {
          const opt = document.createElement("option");
          opt.value = cam.deviceId;
          opt.textContent = cam.label || `카메라 ${i + 1}`;
          deviceSelect.appendChild(opt);
        });
      } catch (e) {}
    }

    deviceSelect.addEventListener("change", () => startVideoStream(deviceSelect.value));
    resolutionSelect.addEventListener("change", () => startVideoStream(deviceSelect.value || undefined));

    /* --------------------------------------------------------------------------
       [4] 정밀 NMS 및 기하학적 필터링 (허공 박스 및 중복 방지)
       -------------------------------------------------------------------------- */
    // IoU (Intersection over Union) 계산
    function calculateIoU(a, b) {
      const x1 = Math.max(a.x, b.x);
      const y1 = Math.max(a.y, b.y);
      const x2 = Math.min(a.x + a.w, b.x + b.w);
      const y2 = Math.min(a.y + a.h, b.y + b.h);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const union = a.w * a.h + b.w * b.h - inter;
      return union > 0 ? inter / union : 0;
    }

    // NMS (Non-Maximum Suppression)
    function applyNMS(boxes, iouThreshold = 0.4) {
      if (boxes.length <= 1) return boxes;
      // score 높은 순 정렬
      const sorted = [...boxes].sort((a, b) => (b.score || 0) - (a.score || 0));
      const selected = [];

      for (const box of sorted) {
        let overlap = false;
        for (const chosen of selected) {
          if (calculateIoU(box, chosen) > iouThreshold) {
            overlap = true;
            break;
          }
        }
        if (!overlap) selected.push(box);
      }
      return selected;
    }

    // 유효 얼굴 검증 필터 (크기, 종횡비, 키포인트 포함 여부)
    function isValidFaceBox(box, videoW, videoH, keypoints = []) {
      // 1. 최소 크기 필터: 비디오 가로폭의 2% 미만 제외
      if (box.w < videoW * 0.02 || box.h < videoH * 0.02) return false;

      // 2. 종횡비 필터: 0.6 ~ 1.6 벗어나면 제외
      const aspect = box.w / box.h;
      if (aspect < 0.6 || aspect > 1.6) return false;

      // 3. 키포인트(눈 2개, 코, 입)가 박스 내부에 존재하는지 검증 (허공 박스 제거)
      if (keypoints && keypoints.length >= 4) {
        // BlazeFace 키포인트 인덱스: 0: 오른쪽 눈, 1: 왼쪽 눈, 2: 코끝, 3: 입 중심
        let inCount = 0;
        for (let i = 0; i < 4; i++) {
          const kp = keypoints[i];
          if (!kp) continue;
          const kx = kp.x * videoW;
          const ky = kp.y * videoH;
          if (kx >= box.x && kx <= box.x + box.w && ky >= box.y && ky <= box.y + box.h) {
            inCount++;
          }
        }
        if (inCount < 2) return false; // 2개 이상의 핵심 키포인트가 박스 안에 없으면 사물/허공으로 판정
      }

      return true;
    }

    /* --------------------------------------------------------------------------
       [5] 원거리 타일 탐지 알고리즘 (2x2 / 3x2) + runningMode: "IMAGE"
       -------------------------------------------------------------------------- */
    function generateTiles(videoW, videoH, mode) {
      if (mode === "1x1") {
        return [{ x: 0, y: 0, w: videoW, h: videoH }];
      }

      const tiles = [];
      const cols = mode === "3x2" ? 3 : 2;
      const rows = 2;
      const overlap = 0.20; // 20% 겹침

      const stepX = (videoW * (1 - overlap)) / (cols - overlap);
      const tileW = stepX / (1 - overlap);
      const stepY = (videoH * (1 - overlap)) / (rows - overlap);
      const tileH = stepY / (1 - overlap);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tx = Math.min(c * (tileW * (1 - overlap)), videoW - tileW);
          const ty = Math.min(r * (tileH * (1 - overlap)), videoH - tileH);
          tiles.push({
            x: Math.round(tx),
            y: Math.round(ty),
            w: Math.round(tileW),
            h: Math.round(tileH)
          });
        }
      }
      return tiles;
    }

    // 타일 이미지 탐지 수행
    function detectFacesInFrame() {
      if (!state.faceDetector || video.readyState < 2) return [];

      const vw = state.videoWidth;
      const vh = state.videoHeight;
      const tiles = generateTiles(vw, vh, state.tileMode);
      const rawCandidates = [];

      tiles.forEach((tile) => {
        state.detectCanvas.width = tile.w;
        state.detectCanvas.height = tile.h;

        // 전처리: 탐지용 캔버스에만 밝기/대비 보정 적용 (화면 비디오에는 영향 없음)
        if (state.usePreprocess) {
          state.detectCtx.filter = "brightness(1.2) contrast(1.15)";
        } else {
          state.detectCtx.filter = "none";
        }

        state.detectCtx.drawImage(video, tile.x, tile.y, tile.w, tile.h, 0, 0, tile.w, tile.h);

        try {
          const res = state.faceDetector.detect(state.detectCanvas);
          if (res.detections && res.detections.length > 0) {
            res.detections.forEach((det) => {
              const bb = det.boundingBox;
              const globalBox = {
                x: tile.x + bb.originX,
                y: tile.y + bb.originY,
                w: bb.width,
                h: bb.height,
                score: det.categories?.[0]?.score || 0.5
              };

              // 키포인트 좌표 정규화 -> 비디오 전체 정규화로 환산
              const keypoints = (det.keypoints || []).map((kp) => ({
                x: (tile.x + kp.x * tile.w) / vw,
                y: (tile.y + kp.y * tile.h) / vh
              }));

              if (isValidFaceBox(globalBox, vw, vh, keypoints)) {
                rawCandidates.push({ ...globalBox, keypoints });
              }
            });
          }
        } catch (e) {
          console.warn("Tile detection error:", e);
        }
      });

      // 중복 박스 NMS 병합
      return applyNMS(rawCandidates, 0.4);
    }

    /* --------------------------------------------------------------------------
       [6] 잔상 제거 & 간단한 트래커 (지수평활 + 3프레임 확정 + 6프레임 소멸)
       -------------------------------------------------------------------------- */
    function updateTracking(detections) {
      const usedDetectionIdx = new Set();

      // 기존 트랙 업데이트
      state.tracks.forEach((track) => {
        if (track.isManual) return; // 수동 추가 박스는 영구 보존

        let bestIdx = -1;
        let bestDist = Infinity;

        detections.forEach((det, i) => {
          if (usedDetectionIdx.has(i)) return;
          const dist = Math.hypot(
            (det.x + det.w / 2) - (track.box.x + track.box.w / 2),
            (det.y + det.h / 2) - (track.box.y + track.box.h / 2)
          );
          // 박스 대각선 길이 이내 매칭 허용
          const maxMatchDist = Math.max(track.box.w, track.box.h) * 0.9;
          if (dist < maxMatchDist && dist < bestDist) {
            bestDist = dist;
            bestIdx = i;
          }
        });

        if (bestIdx !== -1) {
          const matched = detections[bestIdx];
          // 지수평활 필터: 새 값 0.4 : 이전 값 0.6 (부드러운 이동)
          track.box.x = track.box.x * 0.6 + matched.x * 0.4;
          track.box.y = track.box.y * 0.6 + matched.y * 0.4;
          track.box.w = track.box.w * 0.6 + matched.w * 0.4;
          track.box.h = track.box.h * 0.6 + matched.h * 0.4;
          track.keypoints = matched.keypoints;
          track.matchedFrames++;
          track.missedFrames = 0;
          usedDetectionIdx.add(bestIdx);
        } else {
          track.missedFrames++;
        }
      });

      // 새 얼굴 등록
      detections.forEach((det, i) => {
        if (usedDetectionIdx.has(i)) return;
        state.tracks.push({
          id: state.nextTrackId++,
          box: { x: det.x, y: det.y, w: det.w, h: det.h },
          matchedFrames: 1,
          missedFrames: 0,
          isManual: false,
          keypoints: det.keypoints
        });
      });

      // 매칭 실패 박스는 6프레임(약 0.1~0.2초) 유지 후 완전히 소멸 (잔상 방지)
      state.tracks = state.tracks.filter(
        (t) => t.isManual || t.missedFrames <= 6
      );
    }

    /* --------------------------------------------------------------------------
       [7] 메인 루프 (단 1개 유지, 보간 렌더링 & N프레임 간격 탐지)
       -------------------------------------------------------------------------- */
    function detectionLoop() {
      if (!state.isRunning) return;

      // FPS 측정
      state.fpsFrames++;
      const now = performance.now();
      if (now - state.lastFpsTime >= 1000) {
        fpsNum.textContent = String(state.fpsFrames);
        // FPS가 18 이하로 떨어지면 자동으로 타일 수를 1x1로 경량화하여 지연 방지
        if (state.fpsFrames < 18 && state.tileMode === "3x2") {
          state.tileMode = "2x2";
          tileSelect.value = "2x2";
        }
        state.fpsFrames = 0;
        state.lastFpsTime = now;
      }

      // 추첨 진행 중(isDrawing)이거나 위치 고정(isLocked) 상태일 때는 AI 탐지를 일시 정지하고 고정 렌더링
      if (!state.isDrawing && !state.isLocked) {
        state.frameCounter++;
        // 3프레임마다 1회 탐지 수행, 나머지 프레임은 트래킹 보간만 적용해 60fps 유지
        if (state.frameCounter % 3 === 0) {
          const detections = detectFacesInFrame();
          updateTracking(detections);
        }
      }

      // 확정된 얼굴만 렌더링
      renderViewfinder();

      // 연속 3프레임 이상 탐지된 확정 얼굴 수 집계
      const confirmedTracks = getConfirmedTracks();
      faceCountNum.textContent = String(confirmedTracks.length);
      lowCountAlert.style.display = confirmedTracks.length > 0 && confirmedTracks.length < 5 ? "block" : "none";
      updateDrawButtonState();

      state.animationFrameId = requestAnimationFrame(detectionLoop);
    }

    // "확정 얼굴" 필터: 수동 등록이거나 연속 3프레임 이상 탐지된 얼굴만 인정
    function getConfirmedTracks() {
      return state.tracks.filter((t) => t.isManual || t.matchedFrames >= 3);
    }

    /* --------------------------------------------------------------------------
       [8] 캔버스 뷰파인더 렌더링 (좌우 반전 보정 & 고유 번호 배지)
       -------------------------------------------------------------------------- */
    function renderViewfinder(activeId = null, flashColor = "#F5B942", lockedIds = null) {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      const confirmedTracks = getConfirmedTracks();

      confirmedTracks.forEach((track) => {
        // 비디오 원본 좌표 -> 화면 표시 좌표로 스케일링
        let renderX = track.box.x * state.scaleX;
        let renderY = track.box.y * state.scaleY;
        const renderW = track.box.w * state.scaleX;
        const renderH = track.box.h * state.scaleY;

        // 좌우 반전 시 직접 그리기 보정: x = 표시폭 - (x + 박스폭)
        if (state.isMirror) {
          renderX = state.displayWidth - (renderX + renderW);
        }

        let color = track.isManual ? "#38BDF8" : "#4FD1C5"; // 수동: 스카이블루, AI: 시안
        let lineWidth = 2;

        if (lockedIds?.has(track.id)) {
          color = "#F5B942";
          lineWidth = 4;
        } else if (track.id === activeId) {
          color = flashColor;
          lineWidth = 5;
        }

        drawCornerBrackets(overlayCtx, renderX, renderY, renderW, renderH, color, lineWidth);
        drawNumberBadge(overlayCtx, renderX, renderY, renderW, renderH, track.id, color);
      });
    }

    function drawCornerBrackets(ctx, x, y, w, h, color, lineWidth) {
      const len = Math.min(w, h) * 0.28;
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = "round";

      const corners = [
        [x, y, 1, 1],
        [x + w, y, -1, 1],
        [x, y + h, 1, -1],
        [x + w, y + h, -1, -1]
      ];
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy + len * dy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + len * dx, cy);
        ctx.stroke();
      });
    }

    function drawNumberBadge(ctx, x, y, w, h, id, color) {
      const label = String(id);
      const cx = x + Math.min(22, w * 0.2);
      const cy = Math.max(14, y - 12);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.font = "700 14px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const textW = ctx.measureText(label).width;
      const boxW = Math.max(24, textW + 12);
      const boxH = 22;

      ctx.fillStyle = color;
      ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
      ctx.fillStyle = "#0B0E14";
      ctx.fillText(label, 0, 1);
      ctx.restore();
    }

    /* --------------------------------------------------------------------------
       [9] 터치/클릭 강제 등록 및 삭제 (전자칠판 대형 스크린 지원)
       -------------------------------------------------------------------------- */
    viewportContainer.addEventListener("pointerdown", (e) => {
      if (state.isDrawing) return;

      const rect = overlay.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (clickX < 0 || clickX > rect.width || clickY < 0 || clickY > rect.height) return;

      // 화면 표시 픽셀 -> 비디오 원본 픽셀 역환산
      let videoTargetX;
      if (state.isMirror) {
        videoTargetX = (state.displayWidth - clickX) / state.scaleX;
      } else {
        videoTargetX = clickX / state.scaleX;
      }
      const videoTargetY = clickY / state.scaleY;

      // 클릭 지점에 이미 존재하는 박스 확인
      const hitIdx = state.tracks.findIndex((t) => {
        const cx = t.box.x + t.box.w / 2;
        const cy = t.box.y + t.box.h / 2;
        return Math.hypot(videoTargetX - cx, videoTargetY - cy) < Math.max(t.box.w, t.box.h, 40);
      });

      if (hitIdx !== -1) {
        // 이미 있는 박스 터치 시 즉시 삭제
        state.tracks.splice(hitIdx, 1);
      } else {
        // 빈 공간 터치 시 강제 얼굴 등록 (비디오 비율에 맞춘 크기)
        const defW = state.videoWidth * 0.065;
        const defH = state.videoHeight * 0.09;
        state.tracks.push({
          id: state.nextTrackId++,
          box: {
            x: Math.max(0, Math.min(videoTargetX - defW / 2, state.videoWidth - defW)),
            y: Math.max(0, Math.min(videoTargetY - defH / 2, state.videoHeight - defH)),
            w: defW,
            h: defH
          },
          matchedFrames: 10,
          missedFrames: 0,
          isManual: true,
          keypoints: []
        });
      }

      renderViewfinder();
      faceCountNum.textContent = String(getConfirmedTracks().length);
      updateDrawButtonState();
    });

    /* --------------------------------------------------------------------------
       [10] 교실 30명 지원 기능 (자동 채우기, 좌석 일괄 배치, 위치 고정, 미러 토글)
       -------------------------------------------------------------------------- */
    // 1. 좌우 반전 토글
    mirrorToggleBtn.addEventListener("click", () => {
      state.isMirror = !state.isMirror;
      video.classList.toggle("is-unmirrored", !state.isMirror);
      mirrorToggleBtn.classList.toggle("is-active", state.isMirror);
      mirrorToggleBtn.textContent = state.isMirror ? "↔️ 좌우 반전 ON" : "➡️ 좌우 반전 OFF";
      renderViewfinder();
    });

    // 2. 위치 고정 (잠금) 토글
    lockPositionsBtn.addEventListener("click", () => {
      state.isLocked = !state.isLocked;
      lockPositionsBtn.classList.toggle("is-locked", state.isLocked);
      lockPositionsBtn.textContent = state.isLocked ? "🔒 위치 고정됨 (해제)" : "📌 위치 고정 (잠금)";
    });

    // 3. 교실 30명 좌석 일괄 배치 (5행 6열)
    grid30Btn.addEventListener("click", () => {
      state.tracks = [];
      state.nextTrackId = 1;

      const rows = 5;
      const cols = 6;
      const vw = state.videoWidth || 1920;
      const vh = state.videoHeight || 1080;

      for (let r = 0; r < rows; r++) {
        // 원근감: 뒷자리(r=0)는 작고, 앞자리(r=4)는 큼
        const boxW = vw * (0.045 + (r / 4) * 0.025);
        const boxH = vh * (0.065 + (r / 4) * 0.035);
        const y = vh * 0.16 + (r / 4) * (vh * 0.64) - boxH / 2;

        for (let c = 0; c < cols; c++) {
          const x = vw * 0.08 + (c / 5) * (vw * 0.84) - boxW / 2;
          state.tracks.push({
            id: state.nextTrackId++,
            box: { x, y, w: boxW, h: boxH },
            matchedFrames: 10,
            missedFrames: 0,
            isManual: true,
            keypoints: []
          });
        }
      }

      state.isLocked = true;
      lockPositionsBtn.classList.add("is-locked");
      lockPositionsBtn.textContent = "🔒 위치 고정됨 (해제)";

      renderViewfinder();
      faceCountNum.textContent = "30";
      updateDrawButtonState();
    });

    // 4. 미인식 빈자리 30명 자동 채우기
    fill30Btn.addEventListener("click", () => {
      const confirmed = getConfirmedTracks();
      if (confirmed.length >= 30) {
        alert(`이미 ${confirmed.length}명이 등록되어 있습니다.`);
        return;
      }

      const vw = state.videoWidth || 1920;
      const vh = state.videoHeight || 1080;
      const rows = 5;
      const cols = 6;
      const candidates = [];

      for (let r = 0; r < rows; r++) {
        const boxW = vw * (0.045 + (r / 4) * 0.025);
        const boxH = vh * (0.065 + (r / 4) * 0.035);
        const y = vh * 0.16 + (r / 4) * (vh * 0.64) - boxH / 2;
        for (let c = 0; c < cols; c++) {
          const x = vw * 0.08 + (c / 5) * (vw * 0.84) - boxW / 2;
          candidates.push({ x, y, w: boxW, h: boxH });
        }
      }

      // 기존 트랙들과 가장 거리가 먼 빈 슬롯 순으로 정렬
      const scored = candidates.map((cand) => {
        let minDist = Infinity;
        const cx = cand.x + cand.w / 2;
        const cy = cand.y + cand.h / 2;
        confirmed.forEach((t) => {
          const dist = Math.hypot(cx - (t.box.x + t.box.w / 2), cy - (t.box.y + t.box.h / 2));
          if (dist < minDist) minDist = dist;
        });
        return { cand, minDist };
      });
      scored.sort((a, b) => b.minDist - a.minDist);

      const needed = 30 - confirmed.length;
      for (let i = 0; i < needed && i < scored.length; i++) {
        const c = scored[i].cand;
        state.tracks.push({
          id: state.nextTrackId++,
          box: { x: c.x, y: c.y, w: c.w, h: c.h },
          matchedFrames: 10,
          missedFrames: 0,
          isManual: true,
          keypoints: []
        });
      }

      state.isLocked = true;
      lockPositionsBtn.classList.add("is-locked");
      lockPositionsBtn.textContent = "🔒 위치 고정됨 (해제)";

      renderViewfinder();
      faceCountNum.textContent = String(getConfirmedTracks().length);
      updateDrawButtonState();
    });

    // 5. 전체 초기화
    clearAllFacesBtn.addEventListener("click", () => {
      state.tracks = [];
      state.nextTrackId = 1;
      state.isLocked = false;
      lockPositionsBtn.classList.remove("is-locked");
      lockPositionsBtn.textContent = "📌 위치 고정 (잠금)";
      renderViewfinder();
      faceCountNum.textContent = "0";
      updateDrawButtonState();
    });

    // 6. 튜닝 패널 변경 리스너
    confidenceSlider.addEventListener("input", () => {
      state.minConfidence = parseFloat(confidenceSlider.value);
      confidenceVal.textContent = state.minConfidence.toFixed(2);
      localStorage.setItem("cfg_confidence", String(state.minConfidence));
      initFaceDetector(); // 재초기화
    });

    tileSelect.addEventListener("change", () => {
      state.tileMode = tileSelect.value;
      localStorage.setItem("cfg_tile", state.tileMode);
    });

    preprocessBright.addEventListener("change", () => {
      state.usePreprocess = preprocessBright.checked;
      localStorage.setItem("cfg_preprocess", String(state.usePreprocess));
    });

    // 저장된 설정값 복원
    confidenceSlider.value = String(state.minConfidence);
    confidenceVal.textContent = state.minConfidence.toFixed(2);
    tileSelect.value = state.tileMode;
    preprocessBright.checked = state.usePreprocess;

    /* --------------------------------------------------------------------------
       [11] 추첨 연동 & 룰렛 애니메이션 (확정 얼굴 목록 스냅샷 기반)
       -------------------------------------------------------------------------- */
    function updateDrawButtonState() {
      if (state.isDrawing) return;
      const count = getConfirmedTracks().length;
      pickCountInput.max = Math.max(1, count);
      drawBtn.disabled = count < 1 || Number(pickCountInput.value) > count;
    }

    pickCountInput.addEventListener("input", updateDrawButtonState);
    $("countMinus").addEventListener("click", () => stepInput(pickCountInput, -1));
    $("countPlus").addEventListener("click", () => stepInput(pickCountInput, 1));

    function stepInput(input, delta) {
      const min = Number(input.min || 1);
      const max = input.max ? Number(input.max) : Infinity;
      input.value = Math.min(max, Math.max(min, Number(input.value) + delta));
      input.dispatchEvent(new Event("input"));
    }

    const SPIN_DELAYS = [70, 70, 80, 90, 100, 115, 135, 160, 190, 225, 265, 310, 360, 420];
    const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

    drawBtn.addEventListener("click", runCameraDraw);
    resetBtn.addEventListener("click", resetCameraMode);

    async function runCameraDraw() {
      // 추첨 시작 순간 "확정 얼굴" 목록을 완벽 스냅샷으로 고정 (박스 변동 차단)
      const confirmedSnapshot = getConfirmedTracks().map((t) => ({ ...t, box: { ...t.box } }));
      const pickCount = Number(pickCountInput.value);
      if (confirmedSnapshot.length < 1 || pickCount > confirmedSnapshot.length) return;

      state.isDrawing = true;
      drawBtn.disabled = true;
      drawBtn.textContent = "추첨 진행 중…";

      // 왼쪽에서 오른쪽으로 정렬
      const candidates = [...confirmedSnapshot].sort((a, b) => a.box.x - b.box.x);
      const winners = pickRandomUnique(candidates, pickCount);
      const lockedIds = new Set();
      let pool = [...candidates];

      for (const winner of winners) {
        const targetIndex = pool.findIndex((c) => c.id === winner.id);
        const steps = SPIN_DELAYS.length;
        for (let k = 0; k < steps; k++) {
          const idx = ((targetIndex - (steps - 1 - k)) % pool.length + pool.length) % pool.length;
          renderViewfinder(pool[idx].id, k % 2 === 0 ? "#F5B942" : "#FFFFFF", lockedIds);
          await sleep(SPIN_DELAYS[k]);
        }
        lockedIds.add(winner.id);
        pool = pool.filter((c) => c.id !== winner.id);
        renderViewfinder(null, null, lockedIds);
      }

      // 당첨자 썸네일 크롭 및 결과 표시
      const frameSnapshot = captureCleanFrame();
      showResults(
        winners.map((w, i) => ({
          label: `발표자 ${i + 1} · ${w.id}번`,
          thumb: cropFaceThumbnail(frameSnapshot, w)
        }))
      );

      fireConfetti();
      drawBtn.hidden = true;
      resetBtn.hidden = false;
    }

    function resetCameraMode() {
      resultPanel.hidden = true;
      resultList.innerHTML = "";
      drawBtn.hidden = false;
      resetBtn.hidden = true;
      drawBtn.textContent = "추첨 시작";
      drawBtn.disabled = false;
      state.isDrawing = false;
    }

    // 결과 썸네일 생성을 위한 클린 프레임 캡처
    function captureCleanFrame() {
      const c = document.createElement("canvas");
      c.width = state.videoWidth;
      c.height = state.videoHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(video, 0, 0, c.width, c.height);
      return c;
    }

    function cropFaceThumbnail(frameCanvas, track) {
      const out = document.createElement("canvas");
      out.width = 160;
      out.height = 160;
      const ctx = out.getContext("2d");

      const pad = Math.max(track.box.w, track.box.h) * 0.4;
      const sx = Math.max(0, track.box.x - pad);
      const sy = Math.max(0, track.box.y - pad);
      const sw = Math.min(frameCanvas.width - sx, track.box.w + pad * 2);
      const sh = Math.min(frameCanvas.height - sy, track.box.h + pad * 2);

      ctx.fillStyle = "#12161F";
      ctx.fillRect(0, 0, 160, 160);
      ctx.drawImage(frameCanvas, sx, sy, sw, sh, 0, 0, 160, 160);
      return out.toDataURL("image/png");
    }

    function showResults(items) {
      resultList.innerHTML = "";
      items.forEach((item, i) => {
        const chip = document.createElement("div");
        chip.className = "result-chip";
        chip.style.animationDelay = `${i * 100}ms`;

        if (item.thumb) {
          const img = document.createElement("img");
          img.src = item.thumb;
          img.alt = item.label;
          chip.appendChild(img);
        }
        const label = document.createElement("span");
        label.className = "result-chip-label";
        label.textContent = item.label;
        chip.appendChild(label);
        resultList.appendChild(chip);
      });
      resultPanel.hidden = false;
    }

    // 공정한 암호학적 난수 비복원추출
    function pickRandomUnique(list, count) {
      const pool = [...list];
      const picked = [];
      const n = Math.min(count, pool.length);
      for (let i = 0; i < n; i++) {
        const rand = new Uint32Array(1);
        crypto.getRandomValues(rand);
        const idx = rand[0] % pool.length;
        picked.push(pool[idx]);
        pool.splice(idx, 1);
      }
      return picked;
    }

    /* --------------------------------------------------------------------------
       [12] 번호 추첨 모드 (예비 모드)
       -------------------------------------------------------------------------- */
    function setMode(mode) {
      state.mode = mode;
      const isCam = mode === "camera";
      $("cameraMode").classList.toggle("is-active", isCam);
      $("manualMode").classList.toggle("is-active", !isCam);
      $("modeCameraBtn").classList.toggle("is-active", isCam);
      $("modeManualBtn").classList.toggle("is-active", !isCam);

      if (isCam && !state.stream) startVideoStream();
      if (!isCam) buildManualGrid();
    }
    $("modeCameraBtn").addEventListener("click", () => setMode("camera"));
    $("modeManualBtn").addEventListener("click", () => setMode("manual"));

    function buildManualGrid() {
      const total = Math.max(1, Number(totalCountInput.value) || 30);
      manualGrid.innerHTML = "";
      for (let i = 1; i <= total; i++) {
        const cell = document.createElement("div");
        cell.className = "manual-num";
        cell.textContent = String(i);
        cell.dataset.num = String(i);
        manualGrid.appendChild(cell);
      }
      pickCountManualInput.max = total;
    }
    totalCountInput.addEventListener("change", buildManualGrid);
    $("countMinusM").addEventListener("click", () => stepInput(pickCountManualInput, -1));
    $("countPlusM").addEventListener("click", () => stepInput(pickCountManualInput, 1));

    drawBtnManual.addEventListener("click", async () => {
      const total = Math.max(1, Number(totalCountInput.value) || 30);
      const pickCount = Number(pickCountManualInput.value);
      if (pickCount > total) return;

      drawBtnManual.disabled = true;
      drawBtnManual.textContent = "추첨 진행 중…";

      const poolNums = Array.from({ length: total }, (_, i) => i + 1);
      const winners = pickRandomUnique(poolNums, pickCount);
      let cells = Array.from(manualGrid.children);

      for (const winNum of winners) {
        const targetIdx = cells.findIndex((c) => Number(c.dataset.num) === winNum);
        const steps = SPIN_DELAYS.length;
        for (let k = 0; k < steps; k++) {
          const idx = ((targetIdx - (steps - 1 - k)) % cells.length + cells.length) % cells.length;
          cells.forEach((c) => c.classList.remove("is-flash-a", "is-flash-b"));
          cells[idx].classList.add(k % 2 === 0 ? "is-flash-a" : "is-flash-b");
          await sleep(SPIN_DELAYS[k]);
        }
        cells[targetIdx].classList.remove("is-flash-a", "is-flash-b");
        cells[targetIdx].classList.add("is-winner");
        cells = cells.filter((_, i) => i !== targetIdx);
      }

      showResults(winners.map((n) => ({ label: `${n}번 발표자` })));
      fireConfetti();
      drawBtnManual.hidden = true;
      resetBtnManual.hidden = false;
    });

    resetBtnManual.addEventListener("click", () => {
      manualResultPanel.hidden = true;
      manualResultList.innerHTML = "";
      drawBtnManual.hidden = false;
      resetBtnManual.hidden = true;
      drawBtnManual.disabled = false;
      drawBtnManual.textContent = "추첨 시작";
      buildManualGrid();
    });

    /* --------------------------------------------------------------------------
       [13] 컨페티 축하 연출 & 전체화면
       -------------------------------------------------------------------------- */
    function fireConfetti() {
      const ctx = confettiCanvas.getContext("2d");
      const w = window.innerWidth;
      const h = window.innerHeight;
      const colors = ["#F5B942", "#4FD1C5", "#F1EFE7", "#E1523D"];
      const particles = Array.from({ length: 120 }, () => ({
        x: Math.random() * w,
        y: -20 - Math.random() * 150,
        size: 5 + Math.random() * 5,
        speedY: 2.5 + Math.random() * 3,
        speedX: -1.5 + Math.random() * 3,
        rot: Math.random() * 360,
        spin: -5 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

      const start = performance.now();
      function tick(now) {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p) => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.rot += p.spin;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        if (now - start < 2500) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, w, h);
      }
      requestAnimationFrame(tick);
    }

    $("fullscreenBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    /* --------------------------------------------------------------------------
       초기화 시작
       -------------------------------------------------------------------------- */
    window.addEventListener("DOMContentLoaded", async () => {
      buildManualGrid();
      await initFaceDetector();
      await startVideoStream();
    });
  </script>
</body>
